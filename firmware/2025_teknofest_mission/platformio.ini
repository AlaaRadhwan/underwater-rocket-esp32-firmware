; 2025 TEKNOFEST mission firmware - competition generation (flashed file unidentified)
; Reproducible build: platform, framework and every library are pinned.
; Real credentials live only in include/secrets.h (git-ignored) - copy include/secrets.h.example.
; Set UWR_OTA_PASSWORD in your environment before using the esp32-ota env.
[platformio]
default_envs = esp32-usb

[env]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = my_ota_1p6mb.csv
build_flags = -Os -ffunction-sections -fdata-sections -Wl,--gc-sections -DCORE_DEBUG_LEVEL=0
lib_deps =
  br3ttb/PID@1.2.1
  https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git#32cf0614bccf0d8cff32fbc4260097ac10e5b714
  adafruit/Adafruit PWM Servo Driver Library@3.0.3
  adafruit/Adafruit BusIO@1.17.4
  ; PS5 (DualSense) Bluetooth library: fetched, NOT redistributed here. The upstream repository
  ; carries no licence file - see docs/LICENSING.md. Pinned commit is byte-identical to the copy
  ; used during development (src/ and library.properties compared).
  https://github.com/rodneybakiskan/ps5-esp32.git#42b9ca971876ee19fce35e30a6dfc4232e077e65

[env:esp32-usb]
upload_protocol = esptool
upload_speed = 921600

[env:esp32-ota]
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
  --port=3232
  --auth=${sysenv.UWR_OTA_PASSWORD}
