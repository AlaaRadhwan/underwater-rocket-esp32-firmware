; Early 2025 prototype: direct-GPIO fins, WebSocket PID tuner. Not compiled/verified in staging.
[env:esp32-usb]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  br3ttb/PID@^1.2.1
  https://github.com/sparkfun/SparkFun_ICM-20948_ArduinoLibrary.git
  https://github.com/esphome/ESPAsyncWebServer.git
  https://github.com/me-no-dev/AsyncTCP.git
