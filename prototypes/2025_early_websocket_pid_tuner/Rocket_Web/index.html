<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🚀 Rocket Control Panel</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0b1020;color:#e7ecff;margin:0}
    header{padding:16px 20px;border-bottom:1px solid #1b2344;display:flex;gap:12px;align-items:center}
    header h1{font-size:18px;margin:0}
    header input{background:#0e1530;border:1px solid #27305a;border-radius:8px;padding:8px 10px;color:#e7ecff;min-width:220px}
    header button{background:#1f6feb;border:0;border-radius:8px;color:#fff;padding:8px 12px;cursor:pointer}
    main{display:grid;gap:16px;padding:16px}
    .card{background:#0e1530;border:1px solid #1b2344;border-radius:14px;padding:16px}
    .card h2{font-size:16px;margin:0 0 12px 0;color:#b9c7ff}

    .telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .kv{background:#0b122a;border:1px solid #1b2344;border-radius:10px;padding:10px}
    .kv b{display:block;font-size:12px;color:#97a7ff;margin-bottom:6px}
    .kv .val{font-size:20px}

    .pid-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .pid-grid label{font-size:12px;color:#97a7ff;margin-bottom:6px;display:block}
    .pid-grid input{width:100%;background:#0b122a;border:1px solid #1b2344;border-radius:8px;padding:10px;color:#e7ecff}

    .tabs{display:flex;background:#0b122a;border:1px solid #1b2344;border-radius:10px;overflow:hidden}
    .tabs button{flex:1;background:transparent;color:#c9d5ff;padding:10px;border:0;cursor:pointer}
    .tabs button.active{background:#1f2a52;color:#fff}

    .actions{display:flex;gap:10px;margin-top:12px}
    .actions button{background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:10px 12px;cursor:pointer}
    .actions button.secondary{background:#253260}

    .live-angles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
    .log{background:#061024;border:1px solid #1b2344;border-radius:10px;padding:10px;height:200px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#9bd4ff}
    .muted{color:#9fb0ff;font-size:12px}
  </style>
</head>
<body>
  <header>
    <h1>🚀 Rocket Control Panel</h1>
    <input id="ipInput" placeholder="ESP32 IP (e.g. 192.168.4.1)" />
    <button id="connectBtn">Connect</button>
    <span class="muted" id="statusText">Disconnected</span>
  </header>

  <main>
    <section class="card" id="telemetryCard">
      <h2>📡 Live Telemetry</h2>
      <div class="telemetry">
        <div class="kv"><b>Roll (°)</b><div class="val" id="roll">—</div></div>
        <div class="kv"><b>Pitch (°)</b><div class="val" id="pitch">—</div></div>
        <div class="kv"><b>Yaw (°)</b><div class="val" id="yaw">—</div></div>
      </div>
      <div class="muted" style="margin-top:8px">
        Tip: these update live from WebSocket telemetry sent by the ESP32.
      </div>
    </section>

    <section class="card">
      <h2>🎛️ PID Tuning</h2>

      <!-- Axis tabs -->
      <div class="tabs" id="axisTabs">
        <button data-axis="ROLL" class="active">Roll</button>
        <button data-axis="PITCH">Pitch</button>
        <button data-axis="YAW">Yaw</button>
      </div>

      <!-- PID fields -->
      <div class="pid-grid">
        <div>
          <label for="kp_val">Kp</label>
          <input type="number" id="kp_val" step="0.01" placeholder="e.g. 2.0" />
        </div>
        <div>
          <label for="ki_val">Ki</label>
          <input type="number" id="ki_val" step="0.01" placeholder="e.g. 0.5" />
        </div>
        <div>
          <label for="kd_val">Kd</label>
          <input type="number" id="kd_val" step="0.01" placeholder="e.g. 0.1" />
        </div>
      </div>

      <div class="actions">
        <button id="applyBtn">Apply</button>
        <button id="refreshBtn" class="secondary">Refresh</button>
      </div>

      <div class="muted" style="margin-top:10px" id="pidHint">
        Editing: <b>ROLL</b>
      </div>
    </section>

    <section class="card">
      <h2>📝 Logs</h2>
      <div id="log" class="log"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
